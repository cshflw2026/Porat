V.log=()=>`<div class=add><input id=lg placeholder="Novi događaj" onkeydown="if(event.key=='Enter')al()"><button class=x onclick="al()">＋</button></div>`+(S.log.length?S.log.map((x,i)=>[x,i]).sort((a,b)=>b[0].d.localeCompare(a[0].d)).map(([x,i])=>`<div class=row><div>${esc(x.t)}<small>${fd(x.d)}</small></div><button class=x onclick="S.log.splice(${i},1);save();R()">✕</button></div>`).join(''):'<div class=pad>Prazno</div>');
const iso=m=>new Date(m).toISOString().slice(0,10);
function nx(){const L=srt(S.sea,'from',1)[0];if(!L)return'';const m=L.to?pd(L.to)+S.rot*D:pd(L.from)+(S.rot-1)*D,n=Math.round((m-T)/D);return`<div class=banner style="background:#12365f;color:#cfe3ff">${L.to?'Sljedeći ukrcaj':'Očekivani iskrcaj'}: ${fd(iso(m))} · ${n>=0?'za '+n+' dana':'prije '+(-n)+' dana'}</div>`}
function bkb(){return S.sea.length&&(!S.lb||(T-pd(S.lb))/D>30)?`<div class=banner onclick="S.tab='set';save();R()">⚠ Napravi sigurnosnu kopiju (dodirni)</div>`:''}
function tx(r){const t=r.on+r.tv,bar=S.yr!='all'?`<div class=row><span>Prag ${S.thr} dana</span><b>${Math.round(t/S.thr*100)}%</b></div><div style="height:8px;background:#1a1a1a;margin:0 20px 8px;border-radius:4px"><div style="height:8px;border-radius:4px;background:var(--ac);width:${Math.min(100,t/S.thr*100)}%"></div></div>`:'';return`<div class=h>Dani plovidbe (porezno)</div><div class=row>Na brodu<b>${n2(r.on)}</b></div><div class=row>Putovanje (${r.tvn} × ${S.trv})<b>${n2(r.tv)}</b></div><div class=row><b>Ukupno dani plovidbe</b><b>${n2(t)}</b></div>${bar}`}
function csv(){const h=['Kompanija','Brod','Tip','Dužnost','Ukrcaj','Iskrcaj','Dani na brodu','Dani putovanja','Dani plovidbe','Plaća','Godina iskrcaja'],q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',rows=srt(S.sea,'from').map(c=>[c.co,c.ship,c.type,c.rank,fd(c.from),c.to?fd(c.to):'u tijeku',cd(c),S.trv,cd(c)+S.trv,c.pay||'',iso(seaEnd(c)).slice(0,4)]),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h,...rows].map(x=>x.map(q).join(';')).join('\n')],{type:'text/csv'}));a.download='plovidba-'+td+'.csv';a.click()}
function ys(y){const f=Math.min(...S.sea.map(c=>pd(c.from))),a=Math.max(f,pd(y+'-01-01')),b=Math.min(T,pd(y+'-12-31')),n=S.sea.filter(c=>seaEnd(c)>=a&&seaEnd(c)<=b).length;return{on:S.sea.reduce((s,c)=>s+ov(c,a,b),0),tv:n*S.trv}}
function dots(e){if(!e.clientWidth)return;const i=Math.round(e.scrollLeft/e.clientWidth);if(S.sl!==i){S.sl=i;save()}[0,1,2].forEach(k=>{const d=$('#d'+k);if(d){d.style.opacity=k==i?1:.25;d.style.width=k==i?'18px':'6px'}})}
V.home=()=>{const L=S.sea.length?srt(S.sea,'from',1)[0]:null,cy=+td.slice(0,4),
ring=(p,big,sub,col)=>`<div style="flex:0 0 100%;scroll-snap-align:center;display:flex;justify-content:center"><div style="position:relative;width:230px;height:230px"><svg width=230 height=230 viewBox="0 0 200 200"><circle cx=100 cy=100 r=86 fill=none stroke=#1a1a1a stroke-width=10 /><circle cx=100 cy=100 r=86 fill=none stroke="${col||'#f5b94a'}" stroke-width=10 stroke-linecap=round stroke-dasharray="${Math.max(0,Math.min(1,p))*540.35} 541" transform="rotate(-90 100 100)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px"><div style="font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1">${big}</div><div style="font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5">${sub}</div></div></div></div>`;
let s1,s2,s3,cur={on:0,tv:0},home=0,yl='';
if(!L){s1=s2=s3=ring(0,'—','Dodaj prvu turu u Stažu')}else{
const f=Math.min(...S.sea.map(c=>pd(c.from)));cur=ys(cy);home=Math.max(0,(T-Math.max(f,pd(cy+'-01-01')))/D+1-cur.on);
if(!L.to){const el=Math.round((T-pd(L.from))/D)+1,rem=S.rot-el;s1=ring(el/S.rot,Math.abs(rem),rem>=0?'dana do iskrcaja<br>'+fd(iso(pd(L.from)+(S.rot-1)*D)):'dana preko plana<br>iskrcaj nije unesen')}
else{const el=Math.round((T-pd(L.to))/D),rem=S.rot-el;s1=ring(el/S.rot,Math.abs(rem),rem>=0?'dana do ukrcaja<br>'+fd(iso(pd(L.to)+S.rot*D)):'dana preko plana<br>kod kuće','#5ec98f')}
const t=cur.on+cur.tv,all=S.sea.reduce((a,c)=>a+cd(c),0),tt=all+S.sea.length*S.trv;
s2=ring(t/S.thr,n2(t),'od '+S.thr+' dana plovidbe<br>'+cy);
s3=ring(all/(T-f+1),n2(tt),'ukupno dana plovidbe<br>'+n2(all)+' na brodu + '+S.sea.length*S.trv+' putovanje','#e8e8e8');
for(let y=cy;y>=new Date(f).getUTCFullYear();y--){const q=ys(y),d=q.on+q.tv;yl+=`<div style="display:flex;align-items:center;gap:12px;padding:12px 20px"><div style="width:44px;color:var(--mu);font-size:13px">${y}</div><div style="flex:1;height:6px;border-radius:3px;background:#1a1a1a"><div style="width:${Math.min(100,d/S.thr*100)}%;height:6px;border-radius:3px;background:var(--ac)"></div></div><div style="width:64px;text-align:right;font-size:13px">${n2(d)} d</div></div>`}}
return bn('certs')+bn('docs')+bkb()+`<div id=ca onscroll="dots(this)" style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:18px">${s1}${s2}${s3}</div><div style="display:flex;gap:8px;justify-content:center;margin:16px 0">${[0,1,2].map(i=>`<i id=d${i} style="height:6px;width:6px;border-radius:3px;background:#fff;opacity:.25;transition:.2s"></i>`).join('')}</div><div style="display:flex;margin:8px 20px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)">${[['Na brodu',cur.on],['Putovanje',cur.tv],['Kod kuće',home]].map(([l,v])=>`<div style="flex:1;padding:16px 0"><div style="font-size:20px;font-weight:600">${n2(v)}</div><div style="font-size:12px;color:var(--mu)">${l} · ${cy}</div></div>`).join('')}</div>${yl?'<div class=h>Po godinama</div>'+yl:''}`};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
R();
</script></body></html>
