function csv(){const h=['Kompanija','Brod','Tip','Dužnost','Ukrcaj','Iskrcaj','Dani na brodu','Dani putovanja','Dani plovidbe','Plaća','Godina iskrcaja'],q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',rows=srt(S.sea,'from').map(c=>[c.co,c.ship,c.type,c.rank,fd(c.from),c.to?fd(c.to):'u tijeku',cd(c),S.trv,cd(c)+S.trv,c.pay||'',iso(seaEnd(c)).slice(0,4)]),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h,...rows].map(x=>x.map(q).join(';')).join('\n')],{type:'text/csv'}));a.download='plovidba-'+td+'.csv';a.click()}

function countUp(e){const v=parseFloat(e.dataset.v);if(RM||isNaN(v))return;const t0=performance.now(),I=Number.isInteger(v);(function f(t){if(!e.isConnected)return;const k=Math.min(1,(t-t0)/800),q=1-Math.pow(1-k,3);e.textContent=n2(I?Math.round(v*q):v*q);if(k<1)requestAnimationFrame(f)})(t0)}

V.home=()=>{const L=S.sea.length?srt(S.sea,'from',1)[0]:null,cy=+td.slice(0,4),
ring=(p,big,sub,col,num)=>`<div style="flex:0 0 100%;scroll-snap-align:center;display:flex;justify-content:center"><div style="position:relative;width:230px;height:230px"><svg width=230 height=230 viewBox="0 0 200 200"><circle cx=100 cy=100 r=86 fill=none stroke=#2c3d57 stroke-width=10 />${p>0?`<circle class=rg data-d="${Math.max(0,Math.min(1,p))*540.35}" cx=100 cy=100 r=86 fill=none stroke="${col||'#f5b94a'}" stroke-width=10 stroke-linecap=round style="stroke-dasharray:${Math.max(0,Math.min(1,p))*540.35} 541" transform="rotate(-90 100 100)"/>`:''}</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px"><div style="font-family:Outfit,sans-serif;font-size:60px;font-weight:600;letter-spacing:-.03em;line-height:1" class=cu data-v="${num??(typeof big=='number'?big:'')}">${big}</div><div style="font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5">${sub}</div></div></div></div>`;

const t=cur.on+cur.tv,all=S.sea.reduce((a,c)=>a+ov(c,f,T),0),nT=S.sea.filter(c=>pd(c.from)<=T).length,tt=all+nT*S.trv;
